
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Ticket</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <div class="form-wrapper">

            <a href="/" class="back-link">← Back to Home</a>

            <div class="badge">AI Ticket Routing</div>

            <h1>Route a Support Ticket</h1>

            <p class="subtitle">
                Enter the customer's ticket below and let the
                AI model determine the appropriate category.
            </p>

            <form action="/predict" method="POST">

                <label for="ticket">
                    Ticket Description
                </label>

                <textarea
                    id="ticket"
                    name="ticket"
                    placeholder="Example: I cannot access my account after changing my password..."
                    required
                ></textarea>

                <button type="submit" class="btn">
                    Predict Category
                </button>

            </form>

        </div>

    </div>

</body>
</html>
